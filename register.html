<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <form id="registerForm" class="card" novalidate>
      <h1>Créer un compte</h1>
      <p class="sub">Remplissez les champs ci-dessous pour vous inscrire.</p>

      <div id="message" class="msg" hidden></div>

      <label for="name">Nom complet</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="email">Adresse email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>

      <label for="confirm">Confirmer le mot de passe</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>

      <button type="submit" id="submitBtn">Créer mon compte</button>

      <p class="switch">Vous avez déjà un compte ? <a href="login.html">Se connecter</a></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
