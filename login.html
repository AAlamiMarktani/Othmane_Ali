<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <form id="loginForm" class="card" novalidate>
      <h1>Connexion</h1>
      <p class="sub">Entrez vos identifiants pour accéder à votre compte.</p>

      <div id="message" class="msg" hidden></div>

      <label for="email">Adresse email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit" id="submitBtn">Se connecter</button>

      <p class="switch">Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
